services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      CLIENT_URL: ${CLIENT_URL}
      IMGBB_API_KEY: ${IMGBB_API_KEY}
    expose:
      - "5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - "80"
